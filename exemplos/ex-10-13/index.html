
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fake Store | Sua Loja Virtual</title>

    <link rel="stylesheet" href="./style.css">
    <script src="./main.js" defer></script>
</head>
<body>
    <header class="cabecalho">
        <div class="container">
            <h1>Fake<span>Store</span></h1>
            <p>Encontre os produtos ideais para você.</p>
        </div>
    </header>

    <main class="container">
        <section class="secao-produtos">
            <h2>Nossos produtos</h2>
            <p class="subtitulo">
                Confira nossa seleção de produtos.
            </p>

            <div id="lista-produtos" class="grade-produtos">
                <p class="mensagem">Carregando produtos...</p>
            </div>
        </section>
    </main>

    <footer class="rodape">
        <p>&copy; 2026 FakeStore - Projeto de estudos.</p>
    </footer>
</body>
</html>
